
name: Atualizar ZIP da extensão

on:
  push:
    branches:
      - main
    paths:
      - 'extension/**'
      - '.github/workflows/atualizar-zip.yml'

permissions:
  contents: write

jobs:
  atualizar-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar ZIP atualizado
        run: |
          mkdir -p public
          rm -f public/recruta-zap.zip
          cd extension
          zip -r ../public/recruta-zap.zip .

      - name: Salvar ZIP no GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza ZIP da extensão"
          file_pattern: public/recruta-zap.zip
